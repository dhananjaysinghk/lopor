version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL 16 with pgvector extension
  # ----------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lopor-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-lopor_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-lopor_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Redis 7 Cache & Pub/Sub
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lopor-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. Mailpit (Mock Email Server for Dev Auth Testing)
  # ----------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: lopor-mailpit
    restart: always
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP Port

  # ----------------------------------------------------
  # 4. Prometheus Metrics Server
  # ----------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: lopor-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  # ----------------------------------------------------
  # 5. Grafana Telemetry Dashboard
  # ----------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: lopor-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
