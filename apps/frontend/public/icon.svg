<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Modern Enterprise Gradients -->
    <linearGradient id="lopor-vertical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="lopor-corner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="lopor-horizontal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <linearGradient id="lopor-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric 'L' Monogram with Crisp Architectural Facets -->
  <g shape-rendering="geometricPrecision">
    <!-- Facet 1: Vertical Pillar (Top Stem) -->
    <polygon points="108,52 236,52 236,312 108,236" fill="url(#lopor-vertical)" />

    <!-- Facet 2: Vertical Inner Dimension / Shadow Facet -->
    <polygon points="108,236 236,312 236,384 108,384" fill="url(#lopor-accent)" />

    <!-- Facet 3: Geometric Corner Junction -->
    <polygon points="108,384 236,384 236,460 108,460" fill="url(#lopor-corner)" />

    <!-- Facet 4: Horizontal Foot -->
    <polygon points="236,332 444,332 444,460 236,460" fill="url(#lopor-horizontal)" />

    <!-- Facet 5: Dynamic 45-degree Beveled Corner Fold (Depth accent) -->
    <polygon points="236,332 236,460 304,384" fill="#581C87" opacity="0.4" />
  </g>
</svg>