openapi: 3.0.3
info:
  title: Lopor AI Workspace API
  description: Commercial-grade enterprise AI productivity platform API for documents, pgvector RAG, autonomous multi-step agents, code intelligence, and real-time collaboration.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server
paths:
  /auth/register:
    post:
      summary: Register User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                full_name:
                  type: string
      responses:
        '201':
          description: User Registered Successfully

  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Tokens Dispatched

  /auth/mfa/setup:
    post:
      summary: Initialize TOTP MFA Enrollment
      responses:
        '200':
          description: Base32 secret, QR code URI, and recovery codes returned

  /auth/mfa/verify:
    post:
      summary: Verify 6-digit TOTP Passcode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                secret:
                  type: string
                passcode:
                  type: string
      responses:
        '200':
          description: MFA Verification Successful

  /admin/metrics/summary:
    get:
      summary: Real-Time System Health & Telemetry Metrics
      responses:
        '200':
          description: Telemetry counters, memory stats, and connection metrics

  /admin/health/deep-check:
    get:
      summary: Deep Health Check for Postgres, Redis, and AI Gateways
      responses:
        '200':
          description: Multi-component operational status

  /workspaces/{wsId}/metering/usage:
    get:
      summary: Workspace Consumption Metering & Quota Tracking
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current token and storage usage stats

  /workspaces/{wsId}/security/anonymize:
    post:
      summary: Enterprise Data Anonymization & PII Redaction
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                enable_mapping:
                  type: boolean
      responses:
        '200':
          description: Redacted content and token mapping returned

  /workspaces/{wsId}/agents/verify-guardrails:
    post:
      summary: AI Agent Security Guardrail & Injection Verification
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_text:
                  type: string
                proposed_tool:
                  type: string
                tool_arguments:
                  type: string
      responses:
        '200':
          description: Guardrail compliance score and verdict returned

  /workspaces/{wsId}/agents/plan-dag:
    post:
      summary: Autonomous Task DAG Generation & Cycle Verification
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Topologically sorted multi-stage execution plan

  /workspaces/{wsId}/git/commit:
    post:
      summary: Programmatic Git Commit & Conventional Commit Synthesis
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Commit created with hash and conventional message

  /workspaces/{wsId}/sql/generate:
    post:
      summary: Natural Language Text-to-SQL Query Generator
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Safe SQL query with complexity score and explanation

  /workspaces/{wsId}/code/review:
    post:
      summary: AI Code Reviewer & PR Critique Analysis
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Code health score, inline suggestions, and review verdict

  /workspaces/{wsId}/code/doc-gen:
    post:
      summary: Markdown Documentation & Mermaid Diagram Generator
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Technical documentation synthesized

  /workspaces/{wsId}/vision/extract:
    post:
      summary: Multi-Modal OCR & Document Vision Extraction
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OCR transcript and structured entity metadata

  /workspaces/{wsId}/ai/compress-context:
    post:
      summary: Context Compression & Token Optimization
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Compressed text and token savings metrics

  /workspaces/{wsId}/documents/{docId}/export:
    post:
      summary: Export Document to PDF, HTML, or Markdown
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Streamed document attachment with custom headers

  /workspaces/{wsId}/webhooks:
    post:
      summary: Register Workspace Webhook Subscription
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Webhook registered with HMAC shared secret

  /workspaces/{wsId}/search/hybrid:
    post:
      summary: Reciprocal Rank Fusion (RRF) Hybrid Search
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                top_k:
                  type: integer
      responses:
        '200':
          description: RRF Fused Results Returned

  /ai/pricing-catalog:
    get:
      summary: Retrieve Model Pricing Matrix & Cache Discounts
      responses:
        '200':
          description: Active pricing catalog across frontier AI models

  /workspaces/{wsId}/ai/estimate-cost:
    post:
      summary: Real-Time Token & Streaming Cost Estimator
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cost breakdown, cache savings, and high cost flag returned

  /agents/consensus/specialists:
    get:
      summary: List Specialist Debater Agents
      responses:
        '200':
          description: Catalog of specialist agent debaters and voting weights

  /workspaces/{wsId}/agents/consensus/debate:
    post:
      summary: Run Multi-Agent Consensus Debate
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Multi-round debate verdict, agreement score, and action items

  /voice/tts/voices:
    get:
      summary: List Neural Text-to-Speech Voice Profiles
      responses:
        '200':
          description: Neural voice profiles, accents, and format capabilities

  /workspaces/{wsId}/voice/tts/synthesize:
    post:
      summary: Synthesize Spoken Audio from Text
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Encoded audio stream and speech duration metadata

  /workspaces/{wsId}/voice/tts/document-brief:
    post:
      summary: Convert Document to Executive Spoken Audio Brief
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Narrated audio brief with spoken intro and outro

  /workspaces/{wsId}/documents/dedup/analyze:
    post:
      summary: Semantic Document Deduplication & Clustering
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deduplication clusters, Jaccard pair matches, and token savings

  /workspaces/{wsId}/workflows:
    get:
      summary: List Event-Driven Workflow Automation Rules
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workspace automation rules list
    post:
      summary: Register Event-Driven Workflow Rule
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Workflow automation rule created

  /workspaces/{wsId}/workflows/dispatch:
    post:
      summary: Dispatch Event Through Workflow Orchestrator
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow execution audit traces

  /workspaces/{wsId}/workflows/logs:
    get:
      summary: Retrieve Workflow Execution Audit Logs
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow execution traces and latencies

  /translation/languages:
    get:
      summary: List Supported Translation Languages
      responses:
        '200':
          description: Language profiles, native names, and writing directions

  /workspaces/{wsId}/translation/detect:
    post:
      summary: Automated Language Detection
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detected language code and confidence score

  /workspaces/{wsId}/translation/translate:
    post:
      summary: Multi-Lingual Document Translation with Markdown Preservation
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Translated text with code blocks and links preserved

  /security/redteam/attacks:
    get:
      summary: List Adversarial Red-Team Attack Vectors
      responses:
        '200':
          description: Standardized OWASP/NIST adversarial attack test suite

  /workspaces/{wsId}/security/redteam/fuzz:
    post:
      summary: Automated Adversarial Prompt Injection & Resilience Fuzzing
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resilience score (0-100%), risk rating, and hardening patches

  /workspaces/{wsId}/rag/index/health:
    get:
      summary: Vector Index Health & Bloat Diagnostics
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: pgvector HNSW fragmentation, dead tuples, and estimated recall

  /workspaces/{wsId}/rag/index/calibrate:
    post:
      summary: HNSW Parameter Calibration
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mathematically tuned m, ef_construction, and ef_search values

  /workspaces/{wsId}/rag/index/optimize:
    post:
      summary: Generate Vector Index Compaction & Reindex Plan
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Zero-downtime maintenance SQL scripts (VACUUM, REINDEX)

  /incidents/templates:
    get:
      summary: List SRE & Incident Postmortem Templates
      responses:
        '200':
          description: Blameless postmortem templates and section guidelines

  /workspaces/{wsId}/incidents/analyze-rca:
    post:
      summary: Log-Driven Root Cause Analysis & 5-Whys Interrogation
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Root cause isolation and Five Whys interrogation breakdown

  /workspaces/{wsId}/incidents/generate-postmortem:
    post:
      summary: Generate Blameless Incident Postmortem Report
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comprehensive postmortem report with timeline, MTTD/MTTR, and action items

  # Phase 61: Knowledge Federation & Entity Graph Linker
  /workspaces/{wsId}/federation/links:
    get:
      summary: List Federated Workspace Semantic Links
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of cross-workspace semantic federation links
    post:
      summary: Register Cross-Workspace Federation Link
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Federation link established

  /workspaces/{wsId}/federation/query:
    post:
      summary: Cross-Workspace Federated Search Query
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Federated semantic search results spanning linked workspaces

  # Phase 62: AI Synthetic Dataset & Benchmark Evaluation Generator
  /workspaces/{wsId}/eval/datasets/generate:
    post:
      summary: Generate Synthetic AI Benchmark & Fine-Tuning Dataset
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Synthetic evaluation dataset and domain benchmarks

  /workspaces/{wsId}/eval/datasets/templates:
    get:
      summary: List Evaluation Dataset Benchmark Templates
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Available synthetic benchmark and evaluation templates

  # Phase 63: Intelligent Data Lineage & RAG Provenance Tracking
  /workspaces/{wsId}/lineage/record:
    post:
      summary: Record Document Chunk Lineage & LLM Provenance Event
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lineage event preserved with citation hashes

  /workspaces/{wsId}/lineage/trace:
    get:
      summary: Trace AI Completion Lineage & Document Citation Provenance
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complete provenance trace and citation attribution

  /workspaces/{wsId}/lineage/graph:
    get:
      summary: Get Workspace Data Lineage Graph Topology
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node-edge DAG of document chunks, transformations, and model outputs

  # Phase 64: Intelligent Semantic Router & Zero-Shot Intent Classifier
  /workspaces/{wsId}/router/intents:
    get:
      summary: List Registered Semantic Intent Routes
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of capability routes, exemplars, and target endpoints
    post:
      summary: Register Custom Workspace Intent Route
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custom intent route registered

  /workspaces/{wsId}/router/classify:
    post:
      summary: Sub-5ms Zero-Shot Prompt Intent Classification
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Primary intent classification, confidence scores, and recommended route

  # Phase 65: Intelligent Self-Correction & Autonomous Reflection Verification
  /workspaces/{wsId}/ai/reflect:
    post:
      summary: Multi-Dimensional AI Output Critique & Reflection
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Faithfulness, code correctness, constraint adherence, and completeness scores

  /workspaces/{wsId}/ai/self-correct:
    post:
      summary: Autonomous Reflection & Iterative Self-Correction Loop
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Iterative refinement history and verified compliant output

  # Phase 66: Hierarchical Long-Term Semantic Episodic Memory & Profile Consolidation
  /workspaces/{wsId}/memory/extract:
    post:
      summary: Extract Episodic Knowledge & User Preferences from Dialogue
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Salient episodic memories extracted and stored

  /workspaces/{wsId}/memory/recall:
    post:
      summary: Contextual Memory Retrieval with Recency Decay & Prompt Augmentation
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recalled memories and formatted XML prompt injection block

  /workspaces/{wsId}/memory/items:
    get:
      summary: List Active Episodic Memories for User
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active episodic memories filtered by category

  /workspaces/{wsId}/memory/items/{memoryId}:
    delete:
      summary: Delete Specific Episodic Memory Item
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
        - name: memoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory item deleted successfully

  /workspaces/{wsId}/memory/consolidate:
    post:
      summary: Consolidate & Deduplicate User Episodic Memories
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Consolidation report with merged and pruned memory counts

  /workspaces/{wsId}/memory/purge:
    delete:
      summary: GDPR Right-to-be-Forgotten Permanent Memory Purge
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: All user memories permanently erased

  # Phase 67: Enterprise AI Guardrail, Jailbreak Barrier & Real-Time Firewall
  /workspaces/{wsId}/guardrails/inspect:
    post:
      summary: Bi-Directional AI Prompt & Completion Firewall Inspection
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Firewall evaluation, threat violations, action (BLOCK/SANITIZE/PASS), and masked text

  /workspaces/{wsId}/guardrails/profile:
    get:
      summary: Get Workspace Guardrail Policy Profile
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active severity block thresholds, secret masking toggles, and custom rules
    put:
      summary: Update Workspace Guardrail Policy Profile
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Guardrail policy profile updated

  # Phase 68: Hierarchical GraphRAG, Triplet Extraction & Community Synthesis
  /workspaces/{wsId}/graphrag/extract:
    post:
      summary: Ingest Document & Extract Knowledge Graph Triplets
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Extracted entities, relational edges, and updated community partitions

  /workspaces/{wsId}/graphrag/search/local:
    post:
      summary: Local Graph Search & Multi-Hop Entity Neighborhood Traversal
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subgraph context, connected nodes, edges, and confidence score

  /workspaces/{wsId}/graphrag/search/global:
    post:
      summary: Global Graph Search & Cross-Community Thematic Synthesis
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Holistic architectural synthesis across modular community clusters

  /workspaces/{wsId}/graphrag/visual:
    get:
      summary: Get Force-Directed Graph Visualization Data (D3/Cytoscape)
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nodes, links, degrees, and community clusters for graph UI rendering

  # Phase 69: Multi-Provider Resilience, Dynamic Load Balancing & Circuit Breaker
  /workspaces/{wsId}/resilience/pools/{poolId}:
    get:
      summary: Get Provider Pool Health Telemetry & Circuit Breaker States
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
        - name: poolId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider health, circuit states (CLOSED/OPEN/HALF_OPEN), and average latencies

  /workspaces/{wsId}/resilience/pools:
    post:
      summary: Configure Workspace Multi-Provider Resilience Ensemble
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Provider pool registered with custom balancing strategy and trip thresholds

  /workspaces/{wsId}/resilience/execute:
    post:
      summary: Resilient Multi-Provider Execution with Automated Cascading Failover
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Completion synthesized with provider fallback chain and latency metrics

  # Phase 71: Multi-Step Human-in-the-Loop (HITL) Policy, Approval Gate & Intervention
  /workspaces/{wsId}/hitl/policies:
    post:
      summary: Register or Update HITL Intervention Policy
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Policy registered with action boundaries, severity triggers, and approval limits
    get:
      summary: List Active Workspace Intervention Policies
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active policies and risk tier definitions

  /workspaces/{wsId}/hitl/evaluate:
    post:
      summary: Evaluate Agent Action Against HITL Policy
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Evaluation decision (AUTO_APPROVED, REQUIRES_APPROVAL, BLOCKED)

  /workspaces/{wsId}/hitl/requests/{requestId}/decide:
    post:
      summary: Submit Human Decision on Pending Action
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Human decision recorded (APPROVED, REJECTED, AMENDED)

  /workspaces/{wsId}/hitl/requests/pending:
    get:
      summary: List Pending Actions Requiring Human Approval
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending queue with risk assessment, payload diff, and expiry timer

  # Phase 72: Intelligent Conversational Query Disambiguation & Clarification
  /workspaces/{wsId}/clarification/analyze:
    post:
      summary: Analyze Prompt Ambiguity and Generate Clarifying Options
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ambiguity evaluation and structured clarifying question with options

  /workspaces/{wsId}/clarification/resolve:
    post:
      summary: Resolve Ambiguity and Synthesize Augmented Disambiguated Prompt
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Augmented query with user intent disambiguated

  # Phase 73: Automated AI Evaluation Harness & LLM-as-a-Judge Scoring
  /workspaces/{wsId}/judge/evaluate:
    post:
      summary: Score Model Output Against Evaluation Rubric Dimensions
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Normalized 0-100 evaluation scores, explanations, and pass/fail verdict

  /workspaces/{wsId}/judge/pairwise:
    post:
      summary: Blind Pairwise Model Output Comparison (Model A vs Model B)
      parameters:
        - name: wsId
          in: path
          required: true
          schema:
            type: string
